[package]
name = "voldiq-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
blake3 = "1.8"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_System_Com", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Threading"] }
